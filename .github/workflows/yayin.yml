name: Siteyi yayınla (GitHub Pages)

# Depo ayarlarında Pages kaynağı "GitHub Actions" seçilmeden çalışmaz.
on:
  workflow_run:
    workflows: ["Günlük güncelleme"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dagit
        uses: actions/deploy-pages@v4
